<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NexusVPN — Android APK & Live Interactive App</title>
  <meta name="description" content="NexusVPN Android VPN client with WireGuard and OpenVPN protocols. Zero logs, military-grade encryption, and high-speed global nodes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(8px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          },
          animation: {
            fadeIn: 'fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #020617;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    /* Ambient Background Glow */
    .ambient-glow {
      position: fixed;
      pointer-events: none;
      border-radius: 9999px;
      filter: blur(120px);
      opacity: 0.18;
      z-index: 0;
    }
    .glow-cyan {
      top: -10%;
      left: 20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #06b6d4, #3b82f6);
    }
    .glow-purple {
      bottom: -10%;
      right: 20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #6366f1, #8b5cf6);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">

  <!-- Ambient light blobs -->
  <div class="ambient-glow glow-cyan"></div>
  <div class="ambient-glow glow-purple"></div>

  <!-- React Mount Point -->
  <div id="root" class="relative z-10">
    <!-- Initial Loading State -->
    <div class="min-h-screen flex flex-col items-center justify-center space-y-4">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-cyan-500/30 animate-pulse">
        <svg class="w-6 h-6 text-white animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
      </div>
      <p class="text-sm font-medium text-slate-400 font-mono tracking-wider">LAUNCHING NEXUSVPN...</p>
    </div>
  </div>

  <!-- Compiled Bundle -->
  <script src="dist/bundle.js"></script>
</body>
</html>
